version: '3.8'
services:
  namesrv:
    image: apache/rocketmq:5.3.2
    container_name: rmqnamesrv
    ports:
      - 9876:9876
    networks:
      - rocketmq
    command: sh mqnamesrv

  broker:
    image: apache/rocketmq:5.3.2
    container_name: rmqbroker
    ports:
      - 10909:10909
      - 10911:10911
      - 10912:10912
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
      - JAVA_OPT_EXT=-server -Xms512m -Xmx512m -Xmn128m
    volumes:
      - /Users/junyuzhou/dockerImage/rocketmq/broker.conf:/opt/rocketmq/conf/broker.conf
    depends_on:
      - namesrv
    networks:
      - rocketmq
    command: sh mqbroker -n rmqnamesrv:9876

  proxy:
    image: apache/rocketmq:5.3.2
    container_name: rmqproxy
    networks:
      - rocketmq
    depends_on:
      - broker
      - namesrv
    ports:
      - 8080:8080
      - 8081:8081
    restart: on-failure
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
    command: sh mqproxy

  console:
    image: styletang/rocketmq-console-ng
    platform: linux/amd64  # Force x86_64 emulation
    container_name: rmq-console
    ports:
      - "8090:8080"
    environment:
      - JAVA_OPTS=-Drocketmq.namesrv.addr=rmqnamesrv:9876
      - rocketmq.config.rocketmqVersion=V5_3_2
    depends_on:
      - namesrv
      - broker
    networks:
      - rocketmq

networks:
  rocketmq:
    driver: bridge